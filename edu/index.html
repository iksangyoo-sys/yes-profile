<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI교육 · AI리터러시연구원</title>
<meta name="description" content="AI Agent, 머신러닝·딥러닝 교육과 개발" />
<link rel="icon" href="../icon.svg" type="image/svg+xml" />
<link rel="icon" href="../favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="../apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  color-scheme: light;
  --bg: #faf9f5; --paper: #ffffff; --line: #e8e6dc;
  --ink: #141413; --ink-2: #5e5d59; --ink-3: #8f8d86;
  --b: #5f7a52; --b-soft: #e5ecdf;
  --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
  --serif: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; word-break: keep-all; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 12px; }
.page { max-width: 1120px; margin: 0 auto; padding: 40px 24px 64px; }

.back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 14.5px; }
.back:hover { color: var(--ink); }
.head { margin-top: 22px; display: flex; align-items: center; gap: 18px; }
.head i { flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--b); box-shadow: 0 10px 22px -12px rgba(20,20,19,.45); }
.head h1 { margin: 0; font-family: var(--serif); font-weight: 700; font-size: clamp(28px, 4vw, 40px); letter-spacing: -.02em; line-height: 1.2; }
.head p { margin: 4px 0 0; color: var(--ink-2); font-size: 16px; }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 40px; }
.col { display: flex; flex-direction: column; }

/* 라운딩 사각형 제목 카드 */
.card { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 22px 26px; background: var(--paper); border: 2px solid var(--b); border-radius: 20px; color: var(--b); transition: background .18s, color .18s, transform .18s, box-shadow .18s; }
.card b { font-family: var(--serif); font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
.card small { display: block; margin-top: 2px; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.card .go { flex: none; font-size: 14px; font-weight: 600; white-space: nowrap; }
.card:hover, .card:focus-visible { background: var(--b); color: #fff; transform: translateY(-2px); box-shadow: 0 14px 28px -18px rgba(20,20,19,.5); }
.card:hover small, .card:focus-visible small { color: rgba(255,255,255,.85); }

/* 과목 리스트 */
.subjects { list-style: none; margin: 18px 0 0 22px; padding: 0 0 0 22px; border-left: 2px solid var(--line); display: grid; gap: 12px; }
.subjects li { position: relative; padding: 14px 16px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; }
.subjects li::before { content: ""; position: absolute; left: -24px; top: 26px; width: 22px; border-top: 2px solid var(--line); }
.subjects .no { display: inline-block; min-width: 30px; margin-right: 8px; padding: 1px 7px; border-radius: 999px; background: var(--b-soft); color: var(--b); font-size: 12px; font-weight: 700; text-align: center; vertical-align: 2px; }
.subjects b { font-size: 16px; }
.subjects .hr { float: right; color: var(--ink-3); font-size: 13px; margin-left: 8px; }
.subjects p { margin: 6px 0 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.55; }

.more { margin: 16px 0 0 44px; font-size: 14px; color: var(--b); font-weight: 600; }
.more:hover { text-decoration: underline; }

.foot { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 14px; }

@media (max-width: 860px) {
  .page { padding: 28px 18px 48px; }
  .cols { grid-template-columns: 1fr; gap: 40px; margin-top: 30px; }
  .head i { width: 48px; height: 48px; }
  .card { padding: 18px 20px; }
  .card b { font-size: 21px; }
  .subjects { margin-left: 14px; padding-left: 16px; }
  .subjects li::before { left: -18px; width: 16px; }
  .more { margin-left: 30px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <a class="back" href="../">← AI리터러시연구원 자료 모음</a>

  <div class="head">
    <i aria-hidden="true"></i>
    <div>
      <h1>AI교육</h1>
      <p>AI Agent, 머신러닝·딥러닝 교육과 개발</p>
    </div>
  </div>

  <div class="cols">
    <section class="col" aria-labelledby="t-agent">
      <a class="card" href="../agent/" id="t-agent">
        <span><b>AI Agent</b><small>생산관리·안전관리·사무자동화를 위한 5일 과정</small></span>
        <span class="go">자세히 ↗</span>
      </a>
      <ul class="subjects" id="agentList"></ul>
      <a class="more" href="../agent/">서비스 사례 5가지와 14개 주제 일정 보기 →</a>
    </section>

    <section class="col" aria-labelledby="t-ml">
      <a class="card" href="../ml/" id="t-ml">
        <span><b>머신러닝·딥러닝</b><small>현업 데이터로 직접 배우는 4일 과정</small></span>
        <span class="go">자세히 ↗</span>
      </a>
      <ul class="subjects" id="mlList"></ul>
      <a class="more" href="../ml/">일정·모델 지도·실습 프로젝트 보기 →</a>
    </section>
  </div>

  <p class="foot">우리 회사 업무와 데이터에 맞춘 교육과 개발을 상담해 드립니다. 문의: yes100@kakao.com</p>
</div>

<script>
// 과목 데이터. agent/, ml/ 페이지의 커리큘럼에서 가져왔다. 과목을 고칠 때는 여기만 바꾼다.
const AGENT = [
  ["M1", "AI Agent 개발 방법론 이해", "AI 개념과 기술, AI Agent 이해, 기업 활용사례, 웹 구조(프론트엔드·백엔드·API)", "1.5h"],
  ["M2", "바이브코딩 활용 앱·웹 개발", "Cursor AI 개발 환경, 파이썬 기초, 바이브코딩 앱·웹 개발, Skill 활용", "10.5h"],
  ["M3", "RAG 구현", "LangChain 이해, Document Loader·Embedding·Retriever, Local LLM RAG 실습", "6h"],
  ["M4", "Agent 구현", "CrewAI, LangGraph Ⅰ·Ⅱ, 재고관리·뉴스 분석 Agent 실습", "6h"],
  ["M5", "하네스 엔지니어링", "하네스 엔지니어링 케이스 스터디, 조별 AI Agent 개발 과제와 발표", "6h"]
];
const ML = [
  ["01", "AI활용 파이썬 코딩 기초", "생성 AI 프롬프트 구조, 분석 패키지·VS Code 설치, 파일 자동 분류 코드", "3h"],
  ["02", "데이터 분석", "분석 기획과 과제정의서, 수집·정제, 기초 통계, 시각화, 상관분석·분산분석", "11h"],
  ["03", "모델링", "회귀(선형·Ridge·Lasso), 분류·앙상블(트리·랜덤포레스트·부스팅), 인공신경망, PCA·K-Means", "11h"],
  ["04", "종합 실습", "탭밀도 예측·양극재 불량 분류 모델 개발, Streamlit 예측 웹 배포", "5h"]
];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const render = (rows) => rows.map((r) =>
  '<li><span class="hr">' + r[3] + '</span><span class="no">' + r[0] + "</span><b>" + esc(r[1]) + "</b><p>" + esc(r[2]) + "</p></li>").join("");
document.getElementById("agentList").innerHTML = render(AGENT);
document.getElementById("mlList").innerHTML = render(ML);
</script>
</body>
</html>
