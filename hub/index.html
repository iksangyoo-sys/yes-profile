<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI리터러시연구원</title>
<link rel="icon" href="data:," />
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --card: #ffffff; --line: #e2e6ec;
  --ink: #16191e; --ink-2: #555d6b; --ink-3: #9098a6;
  --accent: #1f4f8a; --accent-soft: #eaf1fa;
  --ax: #1d6b4f; --ax-soft: #e7f4ee;
  --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; word-break: keep-all; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.page { max-width: 960px; margin: 0 auto; padding: 40px 20px 56px; }

header { margin-bottom: 28px; }
header h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
header p { margin: 4px 0 0; color: var(--ink-2); }

.block { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 18px; }
.block > h2 { margin: 0; font-size: 19px; display: flex; align-items: center; gap: 10px; }
.num { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 15px; flex: none; }
.block > .lead { margin: 4px 0 18px 38px; color: var(--ink-2); font-size: 15px; }

.group { margin-top: 18px; }
.group h3 { margin: 0 0 10px; font-size: 15.5px; display: flex; align-items: center; gap: 8px; color: var(--g); }
.group h3::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--g); }
.g-lit { --g: var(--accent); --g-soft: var(--accent-soft); }
.g-ax { --g: var(--ax); --g-soft: var(--ax-soft); }

.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.item { display: flex; gap: 12px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 12px; padding: 14px; background: #fff; transition: border-color .15s, background .15s, transform .15s; }
.item:hover { border-color: var(--g); background: var(--g-soft); transform: translateY(-1px); }
.ic { flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--g-soft); color: var(--g); font-size: 17px; font-weight: 700; }
.item:hover .ic { background: var(--g); color: #fff; }
.txt { flex: 1; min-width: 0; }
.txt b { display: block; font-size: 15.5px; }
.txt span { display: block; font-size: 13.5px; color: var(--ink-2); line-height: 1.45; margin-top: 2px; }
.go { flex: none; color: var(--ink-3); font-size: 14px; margin-top: 2px; }
.item:hover .go { color: var(--g); }

.intro { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 16px 18px; border-radius: 12px; background: var(--accent-soft); }
.intro p { margin: 0; font-size: 17px; font-weight: 600; }
.btn { display: inline-block; background: var(--accent); color: #fff; border-radius: 999px; padding: 8px 18px; font-weight: 600; font-size: 15px; }
.btn:hover { background: #173d6c; }

footer { margin-top: 28px; text-align: center; font-size: 13.5px; color: var(--ink-3); }
@media (max-width: 600px) {
  .page { padding: 28px 16px 40px; }
  header h1 { font-size: 23px; }
  .block { padding: 18px 16px; }
  .block > .lead { margin-left: 0; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>AI리터러시연구원</h1>
    <p>AI 시대에 사람에게 더 필요해진 분석력, 논리력, 표현력을 다룹니다.</p>
  </header>

  <section class="block">
    <h2><span class="num">1</span>AI리터러시연구원 소개</h2>
    <p class="lead">연구원과 유익상 교수를 소개합니다.</p>
    <div class="intro">
      <p>반갑습니다! AI리터러시연구원입니다.</p>
      <a class="btn" href="../" target="_blank" rel="noopener">소개 보기 ↗</a>
    </div>
  </section>

  <section class="block">
    <h2><span class="num">2</span>AI리터러시연구원 제공가치</h2>
    <p class="lead">보고서와 프롬프트를 잘 쓰는 법, 그리고 반복 업무를 줄이는 도구입니다. 누르면 새 창으로 열립니다.</p>
    <div id="groups"></div>
  </section>

</div>

<script>
// 메뉴 목록. 항목을 더하거나 고칠 때는 여기만 바꾼다.
const GH = "https://iksangyoo-sys.github.io";
const GROUPS = [
  {
    cls: "g-lit", name: "프롬프트·보고서 엔지니어링",
    items: [
      { ic: "報", title: "한국 기업식 보고서 작성 스킬", desc: "독자 분석부터 퇴고까지, 한국 기업 보고서 작성법을 담은 스킬", url: GH + "/koreport-skill/" },
      { ic: "AI", title: "보고서 프롬프트 개발 LLM", desc: "보고서 작성에 쓸 프롬프트를 만들어 주는 LLM (처음 열 때 잠시 기다릴 수 있음)", url: "https://report-prompt-agent.onrender.com/" },
      { ic: "82", title: "보고서 작성 프롬프트 템플릿", desc: "바로 쓰는 보고서 작성 프롬프트 템플릿 82개", url: GH + "/yes_prom/" },
      { ic: "企", title: "보고서 기획 프레임워크", desc: "기획 목적과 업무 분야로 찾아보는 기획 프레임워크 지도", url: "../framework/" },
      { ic: "漢", title: "보고서 한자 사용 가이드", desc: "보고서에서 한자를 쓰는 다섯 가지 경우와 사례", url: "../hanja/" }
    ]
  },
  {
    cls: "g-ax", name: "업무자동화",
    items: [
      { ic: "≡", title: "나만의 AI리본 만들기", desc: "자주 쓰는 기능을 모아 나만의 엑셀 리본메뉴 만들기", url: GH + "/RibBuilder/" },
      { ic: "▦", title: "제조 데이터분석 대시보드", desc: "제조 데이터에 따라 자동으로 바뀌는 분석 대시보드", url: "https://gen.yesana.workers.dev/" },
      { ic: "▤", title: "판매 데이터분석 대시보드", desc: "판매 데이터를 분석해 보여 주는 대시보드", url: "https://yes-report.yes100.workers.dev/" }
    ]
  }
];

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.getElementById("groups").innerHTML = GROUPS.map((g) =>
  '<div class="group ' + g.cls + '"><h3>' + esc(g.name) + '</h3><div class="items">' +
  g.items.map((it) =>
    '<a class="item" href="' + esc(it.url) + '" target="_blank" rel="noopener">' +
    '<span class="ic">' + esc(it.ic) + '</span>' +
    '<span class="txt"><b>' + esc(it.title) + '</b><span>' + esc(it.desc) + '</span></span>' +
    '<span class="go">↗</span></a>'
  ).join("") + '</div></div>'
).join("");
</script>
</body>
</html>
