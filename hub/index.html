<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI리터러시연구원</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root {
  color-scheme: light;
  --bg: #faf9f5; --paper: #ffffff; --line: #e8e6dc;
  --ink: #141413; --ink-2: #5e5d59; --ink-3: #8f8d86;
  --a: #c96442; --a-soft: #f6e7df;
  --b: #5f7a52; --b-soft: #e5ecdf;
  --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
  --serif: "Noto Serif KR", "AppleMyungjo", "Batang", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.5; word-break: keep-all; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; border-radius: 999px; }
.page { max-width: 1240px; margin: 0 auto; padding: 48px 24px 56px; }

/* 제목 */
.hello { display: inline-flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font-family: var(--serif); font-weight: 700; font-size: clamp(26px, 4vw, 44px); letter-spacing: -.02em; line-height: 1.25; }
.hello small { font-family: var(--sans); font-weight: 500; font-size: 15px; color: var(--a); letter-spacing: 0; white-space: nowrap; }
.hello:hover small { text-decoration: underline; }
.sub { margin: 10px 0 0; color: var(--ink-2); font-size: 16px; }

/* 마인드맵 (넓은 화면) */
.map { position: relative; width: 100%; aspect-ratio: 1240 / 820; margin: 12px 0 5cqw; container-type: inline-size; }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.map line { stroke-width: 2; stroke-linecap: round; }
.map line.a { stroke: #e3b6a3; }
.map line.b { stroke: #b7c7ad; }
.map line.ab { stroke: var(--line); stroke-width: 3; stroke-dasharray: 2 9; }
.node { position: absolute; transform: translate(-50%, -50%); }
.hub { width: 20cqw; height: 20cqw; border-radius: 50%; display: grid; place-items: center; text-align: center; color: #fff; padding: 2cqw; box-shadow: 0 1.2cqw 3cqw -1.4cqw rgba(20,20,19,.35); }
.hub b { display: block; font-family: var(--serif); font-weight: 700; font-size: 2.05cqw; line-height: 1.3; }
.hub span { display: block; margin-top: .6cqw; font-size: 1.1cqw; opacity: .85; }
.hub.a { background: var(--a); }
.hub.b { background: var(--b); }
.leaf { width: 9.6cqw; height: 9.6cqw; border-radius: 50%; display: grid; place-items: center; text-align: center; padding: .8cqw; background: var(--paper); border: 2px solid var(--c); color: var(--c); font-weight: 700; font-size: 1.28cqw; line-height: 1.3; transition: background .18s, color .18s, transform .18s, box-shadow .18s; }
.leaf::after { content: "↗"; position: absolute; top: 12%; right: 14%; font-size: .95cqw; opacity: .55; }
a.leaf-wrap:hover .leaf, a.leaf-wrap:focus-visible .leaf { background: var(--c); color: #fff; transform: scale(1.07); box-shadow: 0 1cqw 2.4cqw -1.2cqw rgba(20,20,19,.4); }
a.leaf-wrap:focus-visible { outline: none; }
.leaf-wrap { position: absolute; transform: translate(-50%, -4.8cqw); display: flex; flex-direction: column; align-items: center; width: 17cqw; }
.desc { margin-top: .8cqw; padding: .3cqw .6cqw; background: var(--bg); border-radius: 6px; text-align: center; color: var(--ink-2); font-size: max(11.5px, 1.06cqw); line-height: 1.45; }
.ga { --c: var(--a); }
.gb { --c: var(--b); }

/* 세로 배치 (좁은 화면) */
.stack { display: none; }
@media (max-width: 860px) {
  .page { padding: 32px 18px 44px; }
  .map { display: none; }
  .stack { display: grid; gap: 28px; margin-top: 28px; }
  .s-hub { display: flex; align-items: center; gap: 14px; }
  .s-hub i { flex: none; width: 56px; height: 56px; border-radius: 50%; background: var(--c); box-shadow: 0 8px 18px -10px rgba(20,20,19,.45); }
  .s-hub b { font-family: var(--serif); font-size: 21px; display: block; line-height: 1.3; }
  .s-hub span { font-size: 13.5px; color: var(--ink-2); }
  .s-list { list-style: none; margin: 10px 0 0 27px; padding: 0 0 0 25px; border-left: 2px solid var(--line); display: grid; gap: 10px; }
  .s-list li { position: relative; }
  .s-list li::before { content: ""; position: absolute; left: -26px; top: 26px; width: 22px; border-top: 2px solid var(--line); }
  .s-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; transition: border-color .15s; }
  .s-item:hover { border-color: var(--c); }
  .s-dot { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--c); display: grid; place-items: center; color: var(--c); font-size: 13px; }
  .s-item b { display: block; font-size: 15.5px; color: var(--c); }
  .s-item span { display: block; font-size: 13px; color: var(--ink-2); line-height: 1.45; margin-top: 1px; }
}
@media (prefers-reduced-motion: reduce) { .leaf { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <a class="hello" href="../" target="_blank" rel="noopener">반갑습니다. AI리터러시연구원입니다.<small>연구원 소개 ↗</small></a>
  <p class="sub">원을 누르면 해당 자료가 새 창으로 열립니다.</p>

  <div class="map" id="map" aria-hidden="false"></div>
  <div class="stack" id="stack"></div>
</div>

<script>
// 마인드맵 데이터. 항목을 고칠 때는 여기만 바꾼다.
// x, y는 1240 × 820 화면 기준 원의 중심 위치다.
const GH = "https://iksangyoo-sys.github.io";
const HUBS = [
  {
    key: "a", x: 380, y: 420, title: "프롬프트·보고서<br>엔지니어링", tag: "보고서를 잘 쓰게 하는 AI",
    leaves: [
      { x: 380, y: 95,  title: "보고서<br>작성 스킬",   url: GH + "/koreport-skill/", desc: "한국 기업 보고서의 구조·논리·문장을 AI에게 가르친 스킬" },
      { x: 700, y: 210, title: "프롬프트<br>편집기",     url: GH + "/yes_prom/",       desc: "보고서 유형별로 골라 고쳐 쓰는 프롬프트 템플릿 82가지" },
      { x: 105, y: 420, title: "프롬프트<br>생성 LLM",   url: "https://report-prompt-agent.onrender.com/", desc: "보고서를 설명하면 알맞은 프롬프트를 설계해 주는 LLM" },
      { x: 700, y: 630, title: "기획<br>프레임워크",     url: "../framework/",         desc: "기획 목적과 업무 분야로 찾아 쓰는 기획 프레임워크 지도" },
      { x: 380, y: 735, title: "한자<br>사용 가이드",    url: "../hanja/",             desc: "보고서 문장을 짧고 단단하게 만드는 한자 쓰임과 사례" }
    ]
  },
  {
    key: "b", x: 950, y: 420, title: "데이터<br>사이언스", tag: "반복 업무를 줄이는 자동화",
    leaves: [
      { x: 950,  y: 95,  title: "나만의<br>AI 리본",       url: GH + "/RibBuilder/", desc: "자주 쓰는 기능을 모아 나만의 엑셀 리본메뉴를 만드는 도구" },
      { x: 1165, y: 420, title: "제조 데이터<br>대시보드", url: "https://gen.yesana.workers.dev/", desc: "제조 데이터를 넣으면 지표와 차트가 자동으로 바뀌는 분석 대시보드" },
      { x: 950,  y: 735, title: "판매 데이터<br>대시보드", url: "https://yes-report.yes100.workers.dev/", desc: "판매 실적과 흐름을 한눈에 보여 주는 분석 대시보드" }
    ]
  }
];

const W = 1240, H = 820;
const pct = (v, t) => (v / t * 100) + "%";
const plain = (s) => s.replace(/<br>/g, " ");

// 넓은 화면: 선(SVG) + 원(HTML)
let svg = '<svg viewBox="0 0 ' + W + " " + H + '" aria-hidden="true">';
svg += '<line class="ab" x1="' + HUBS[0].x + '" y1="' + HUBS[0].y + '" x2="' + HUBS[1].x + '" y2="' + HUBS[1].y + '"/>';
HUBS.forEach((h) => h.leaves.forEach((l) => {
  svg += '<line class="' + h.key + '" x1="' + h.x + '" y1="' + h.y + '" x2="' + l.x + '" y2="' + l.y + '"/>';
}));
svg += "</svg>";
let html = svg;
HUBS.forEach((h) => {
  html += '<div class="node hub ' + h.key + '" style="left:' + pct(h.x, W) + ";top:" + pct(h.y, H) + '"><div><b>' + h.title + "</b><span>" + h.tag + "</span></div></div>";
  h.leaves.forEach((l) => {
    html += '<a class="leaf-wrap g' + h.key + '" href="' + l.url + '" target="_blank" rel="noopener" style="left:' + pct(l.x, W) + ";top:" + pct(l.y, H) + '" aria-label="' + plain(l.title) + ": " + l.desc + '">' +
      '<span class="leaf" style="position:relative">' + l.title + '</span><span class="desc">' + l.desc + "</span></a>";
  });
});
document.getElementById("map").innerHTML = html;

// 좁은 화면: 세로 배치
document.getElementById("stack").innerHTML = HUBS.map((h) =>
  '<section class="g' + h.key + '"><div class="s-hub"><i></i><div><b>' + plain(h.title) + "</b><span>" + h.tag + "</span></div></div>" +
  '<ul class="s-list">' + h.leaves.map((l) =>
    '<li><a class="s-item" href="' + l.url + '" target="_blank" rel="noopener"><span class="s-dot">↗</span><span><b>' + plain(l.title) + "</b><span>" + l.desc + "</span></span></a></li>"
  ).join("") + "</ul></section>"
).join("");
</script>
</body>
</html>
